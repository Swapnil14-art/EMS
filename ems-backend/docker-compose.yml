version: "3.9"

services:
  backend:
    build: .
    container_name: ems_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ems_net
    extra_hosts:
      - "sandbox.smtp.mailtrap.io:3.86.141.192"

  db:
    image: postgres:16-alpine
    container_name: ems_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems_user
      POSTGRES_PASSWORD: ems_pass
      POSTGRES_DB: ems_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_user -d ems_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_net

  redis:
    image: redis:7-alpine
    container_name: ems_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ems_net

  celery_worker:
    build: .
    container_name: ems_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - .:/app
    depends_on:
      - redis
      - db
    networks:
      - ems_net
    extra_hosts:
      - "sandbox.smtp.mailtrap.io:3.86.141.192"

  celery_beat:
    build: .
    container_name: ems_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    networks:
      - ems_net
    extra_hosts:
      - "sandbox.smtp.mailtrap.io:3.86.141.192"

  nginx:
    image: nginx:1.25-alpine
    container_name: ems_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./storage:/app/storage:ro
    depends_on:
      - backend
    networks:
      - ems_net

volumes:
  postgres_data:

networks:
  ems_net:
    driver: bridge
