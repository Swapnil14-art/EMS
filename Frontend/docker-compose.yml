version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# EMS — Full Stack Docker Compose
# Runs: Frontend (Next.js) + Backend (FastAPI) + Redis + Celery
# Database: Neon PostgreSQL (external, via DATABASE_URL)
# Storage:  OCI Object Storage (external, via OCI_* env vars)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-EMS}
        NEXT_PUBLIC_COLLEGE_NAME: ${NEXT_PUBLIC_COLLEGE_NAME:-NMIMS Shirpur}
    container_name: ems_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    ports:
      - "3000:3000"            # exposed for direct dev access; in prod Nginx proxies this
    # depends_on:
    #   - backend
    networks:
      - ems_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # ── Nginx (Production only — comment out for local dev) ───────────────────
  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: ems_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - ems_network

networks:
  ems_network:
    driver: bridge

volumes:
  redis_data:
