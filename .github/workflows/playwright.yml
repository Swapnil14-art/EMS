name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  quality:
    name: Build and static checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: Frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: Frontend
      run: npm ci
    - name: Type-check frontend
      working-directory: Frontend
      run: npm run type-check
    - name: Build frontend
      working-directory: Frontend
      run: npm run build
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ems-backend/requirements.txt
    - name: Install backend dependencies
      run: pip install -r ems-backend/requirements.txt
    - name: Compile backend
      run: python -m compileall -q ems-backend/app ems-backend/alembic
    - name: Validate production Compose
      run: cp .env.production.example .env.production && docker compose -f docker-compose.prod.yml config -q

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
