
services:
  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_NAME: EMS
        NEXT_PUBLIC_COLLEGE_NAME: "SVKM's NMIMS, Shirpur Campus"
    container_name: ems_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_APP_NAME=EMS
      - NEXT_PUBLIC_COLLEGE_NAME=SVKM's NMIMS, Shirpur Campus
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    networks:
      - ems_net

  # ── Backend API ────────────────────────────────────────────────────────── 
  backend:
    build:
      context: ./Backend
    container_name: ems_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file: ./Backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ems_user:ems_pass@db:5432/ems_db
      - DATABASE_URL_SYNC=postgresql://ems_user:ems_pass@db:5432/ems_db
    volumes:
      - ./Backend/storage:/app/storage
      - ./Backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ems_net
    extra_hosts:
      - "sandbox.smtp.mailtrap.io:3.86.141.192"

  # ── Database ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ems_db
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=25 -c work_mem=2MB
    environment:
      POSTGRES_USER: ems_user
      POSTGRES_PASSWORD: ems_pass
      POSTGRES_DB: ems_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_user -d ems_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_net

  # ── Nginx API Gateway ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ems_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Backend/storage:/app/storage:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ems_net
      
networks:
  ems_net:
    driver: bridge

volumes:
  postgres_data:
