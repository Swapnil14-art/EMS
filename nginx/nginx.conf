worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Docker's embedded DNS keeps upstream service names valid after a container is recreated.
    resolver 127.0.0.11 ipv6=off valid=10s;
    
    # Security: Hide Nginx version
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Rate limiting definition for API abuse prevention
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # ── Global Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none';" always;

        # ── Frontend (Next.js) ──
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Backend API ──
        location /api/ {
            limit_req zone=apilimit burst=20 nodelay;
            set $backend_upstream http://backend:8000;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            client_max_body_size 50M;
        }

        # ── Swagger Docs (Internal/Dev) ──
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Uploaded Files (poster images, docs, etc.) ──
        # /uploads/ maps to /app/storage/ on disk (matching backend's StaticFiles mount)
        location /uploads/ {
            alias /app/storage/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ── Static File Storage (legacy) ──
        location /storage/ {
            alias /app/storage/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
